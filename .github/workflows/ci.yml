name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -e .[dev]
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -q --cov=src --cov-fail-under=80

  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node deps
        run: npm ci --prefix remotion
      - name: ESLint
        run: npx eslint "src/**/*.ts" --max-warnings=0
        working-directory: remotion
      - name: Prettier check
        run: npx prettier --check .
        working-directory: remotion
      - name: Vitest
        run: npx vitest run
        working-directory: remotion

  render-smoke:
    runs-on: ubuntu-latest
    needs: [python, video]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -e .[dev]
      - name: Install Node deps
        run: npm ci --prefix remotion
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Contract + static E2E
        run: pytest tests/integration/test_e2e_campaign.py -q
      - name: Remotion CLI check
        run: npx tsc --noEmit && npx remotion --help
        working-directory: remotion
