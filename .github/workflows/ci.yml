name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -e .[dev]
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -q --cov=src --cov-fail-under=80

  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node deps
        run: npm ci --prefix remotion
      - name: ESLint
        run: npx --prefix remotion eslint . --max-warnings=0
      - name: Prettier check
        run: npx --prefix remotion prettier --check .
      - name: Vitest
        run: npx --prefix remotion vitest run

  render-smoke:
    runs-on: ubuntu-latest
    needs: [python, video]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: microsoft/playwright-github-action@v1
      - name: Contract + static E2E
        run: pytest tests/contract tests/e2e/test_static.py -q
      - name: Remotion dry run
        run: npx --prefix remotion remotion render --dry-run
